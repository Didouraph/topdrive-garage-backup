name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: garage-backup-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish/replace "latest" release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk TopDriveGarageBackup.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release delete latest-apk --yes --cleanup-tag || true
          fi
          gh release create latest-apk TopDriveGarageBackup.apk \
            --title "Top Drive Garage Backup (dernière version)" \
            --notes "APK généré automatiquement à partir du dernier code source. Télécharge TopDriveGarageBackup.apk ci-dessous et installe-le sur ton téléphone."
